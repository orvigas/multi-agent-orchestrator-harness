providers:
  anthropic:
    apiKeyEnv: ANTHROPIC_API_KEY
    baseUrl: https://api.anthropic.com
  openai:
    apiKeyEnv: OPENAI_API_KEY
  openrouter:
    apiKeyEnv: OPENROUTER_API_KEY
    baseUrl: https://openrouter.ai/api/v1

# Solo "orchestrator" vive acá: cada capa 2-7 ya declara sus propios roles
# en su config/*.yml (planner.yml, knowledge-engine.yml, implementation.yml,
# recovery.yml, quality-gate.yml) — loadConfig.ts los compone todos en un
# solo registro. Antes este archivo también declaraba planner/implementer/
# recovery, duplicados y DESINCRONIZADOS de sus configs de capa (p. ej.
# "implementer" aquí decía openrouter/qwen3-coder mientras
# implementation.yml decía anthropic/claude-opus-4-8) — ver
# src/config/roles.test.ts, que ahora falla si eso vuelve a pasar.

# Phase 2.7: Per-role timeout budgets (ms). Overrides PROVIDER_TIMEOUTS_MS for specific roles.
# Different roles have different time requirements:
# - discovery/implementer: complex reasoning, need more time
# - planner: most complex, needs longest budget
# - validators/strategists: quick checks, need less time
roleTimeouts:
  # Planner layer
  discovery: 45_000
  planner: 60_000
  plan_validator: 15_000
  # Implementation layer
  implementer: 45_000
  # Recovery layer
  recovery_diagnostician: 30_000
  recovery_strategist: 15_000
  # Knowledge Engine layer
  evidence_retriever: 40_000
  # Quality Gate layer (if it uses LLM)
  quality_assessor: 20_000

roles:
  orchestrator:
    provider: anthropic
    model: claude-sonnet-5
    maxTokens: 4096
